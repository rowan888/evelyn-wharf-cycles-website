<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Evelyn Wharf Cycles</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="index.html" class="brand-link">
        <img src="images/ewc-logo.png" alt="Evelyn Wharf Cycles logo" class="logo">
      </a>
      <div class="brand-text">
        <h1 data-site-brand>Evelyn Wharf</h1>
        <p class="sub" data-site-tagline>Cycles — Vintage & Repair</p>
      </div>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-navigation" aria-label="Menu"><span class="hamburger" aria-hidden="true"></span></button>
    <nav id="site-navigation" class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="bike-gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <h2 data-contact-title>Contact</h2>
    <p data-contact-intro>Call us or send a message to book a service.</p>

    <form class="contact-form" data-contact-form action="mailto:hello@evelynwharfcycles.example" method="post" enctype="text/plain">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Send</button>
    </form>

    <h3>Visit</h3>
    <p><span data-contact-address>4 Creekside, London SE8 4SA</span> — <span data-contact-hours>Open Tue–Sat 10:00–18:00</span></p>
    <p>Phone: <a data-contact-phone href="tel:07773137995">07773 137995</a></p>

    <div class="map-wrap" aria-hidden="false">
      <iframe
        data-contact-map
        src="https://www.google.com/maps?q=4+Creekside,+London+SE8+4SA&output=embed"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        aria-label="Map: Evelyn Wharf Cycles location">
      </iframe>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Evelyn Wharf Cycles</p>
    <div class="footer-logos">
      <img class="logo-small" src="images/ewc-logo.png" alt="Evelyn Wharf Cycles logo">
      <div class="socials">
        <a href="#" aria-label="Facebook" target="_blank" rel="noopener">
          <img src="images/facebook.svg" alt="Facebook">
        </a>
        <a href="#" aria-label="Instagram" target="_blank" rel="noopener">
          <img src="images/instagram-logo.svg" alt="Instagram">
        </a>
        <a href="https://wa.me/447773137995" aria-label="WhatsApp" target="_blank" rel="noopener">
          <img src="images/whatsapp-glyph-black.svg" alt="WhatsApp">
        </a>
      </div>
    </div>
  </footer>
  <script src="js/site.js" defer></script>
</body>
</html>
